<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fffaf5">
<title>Rainbow Room Library</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#fffaf5;color:#263238;min-height:100vh}button,input{font:inherit}button{touch-action:manipulation}
header{display:flex;justify-content:center;align-items:center;padding:18px 70px;position:sticky;top:0;background:#fffaf5f2;z-index:5;border-bottom:1px solid #0001}
.logo{font-size:clamp(25px,4vw,42px);font-weight:900;text-align:center;user-select:none;-webkit-user-select:none}
#library{padding:24px;max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.book{border:0;background:#fff;border-radius:22px;padding:12px;box-shadow:0 8px 24px #0002;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.book img,.fakecover{width:100%;height:240px;object-fit:cover;border-radius:14px}.fakecover{display:grid;place-items:center;padding:20px;text-align:center;font-size:clamp(22px,3vw,36px);font-weight:900;background:linear-gradient(135deg,#ffe1e1,#fff1b8,#d9f6df,#dbeaff,#eee0ff)}
.booktitle{font-weight:800;font-size:18px;margin:10px 4px 2px;text-align:center}
#reader{display:none;min-height:100vh;background:#111;color:#fff}.readerbar{height:74px;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;gap:10px}
.round{border:0;border-radius:18px;background:#fff;color:#222;font-weight:900;font-size:25px;padding:12px 18px;min-width:76px}.pagetitle{font-weight:800;text-align:center;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pagewrap{height:calc(100vh - 168px);display:grid;place-items:center;padding:10px 20px}.pagewrap img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;background:#fff}
.samplepage{width:min(82vw,850px);height:min(66vh,620px);background:#fff;color:#263238;border-radius:16px;padding:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.samplepage .big{font-size:clamp(48px,8vw,90px)}.samplepage h2{font-size:clamp(26px,4vw,48px)}.samplepage p{font-size:clamp(20px,3vw,34px)}
.nav{height:94px;display:flex;justify-content:center;align-items:center;gap:40px}.nav button{font-size:42px;width:130px;height:72px;border:0;border-radius:22px;background:#fff}
#teacher{display:none;padding:24px;max-width:900px;margin:auto}.teacherHead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.primary,.secondary,.danger{border:0;border-radius:14px;padding:13px 18px;font-weight:800}.primary{background:#263238;color:#fff}.secondary{background:#eee}.danger{background:#ffe1e1;color:#8b1111}
.formcard,.teacherBook{background:#fff;border-radius:20px;padding:18px;box-shadow:0 8px 24px #0002;margin:16px 0}.teacherBook{display:flex;justify-content:space-between;align-items:center;gap:12px}
.field{display:grid;gap:7px;margin:14px 0}.field input[type=text],.field input[type=password]{padding:13px;border:2px solid #ddd;border-radius:12px;font-size:18px;width:100%}
.preview{max-width:100%;max-height:330px;border-radius:14px;display:block;margin:10px auto;background:#eee}.pagecard{border:2px solid #eee;border-radius:18px;padding:16px;margin:14px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.small{font-size:14px;color:#667}.notice{background:#fff3cd;padding:12px;border-radius:14px;margin:12px 0}
.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:20;padding:20px}.modalbox{background:#fff;border-radius:22px;padding:24px;max-width:430px;width:100%;text-align:center}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:14px}#library{padding:14px}.book img,.fakecover{height:210px}.logo{font-size:25px}.pagewrap{height:calc(100vh - 165px)}}
</style>
</head>
<body>
<header id="mainHeader"><div class="logo" id="secretLogo">🌈 RAINBOW ROOM LIBRARY 🌈</div></header>
<main id="library"><div id="bookGrid" class="grid"></div></main>

<section id="reader">
 <div class="readerbar"><button class="round" id="homeBtn">🌈</button><div class="pagetitle" id="readerTitle"></div><button class="round" id="replayBtn">🔊</button></div>
 <div class="pagewrap" id="pageWrap"></div>
 <div class="nav"><button id="prevBtn">⬅️</button><button id="nextBtn">➡️</button></div>
</section>

<section id="teacher">
 <div class="teacherHead"><h1>Teacher Mode 🌈</h1><div class="actions"><button class="secondary" id="exitTeacher">Kid Library</button><button class="primary" id="newBook">＋ Add Book</button></div></div>
 <div class="notice">Books, page photos and recordings are saved on this iPad/browser. This is Version 2; backup/restore comes next.</div>
 <div id="teacherHome"></div>
 <div id="editor" style="display:none"></div>
</section>

<div class="modal" id="pinModal"><div class="modalbox"><h2>Teacher Mode</h2><p>Enter teacher PIN</p><input id="pinInput" type="password" inputmode="numeric" maxlength="6" style="font-size:26px;width:170px;text-align:center;padding:10px;border-radius:12px;border:2px solid #ddd"><div class="actions" style="justify-content:center;margin-top:16px"><button class="secondary" id="pinCancel">Cancel</button><button class="primary" id="pinGo">Open</button></div><p class="small">Default PIN: 2468</p></div></div>

<script>
const DBN='RainbowRoomLibraryDB', STORE='books'; let db, books=[], currentBook=null, currentPage=0, editing=null, rec=null, chunks=[], longTimer;
const $=s=>document.querySelector(s);
function reqP(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function openDB(){db=await new Promise((res,rej)=>{let r=indexedDB.open(DBN,1);r.onupgradeneeded=e=>{e.target.result.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});await loadBooks()}
async function loadBooks(){books=await reqP(db.transaction(STORE).objectStore(STORE).getAll());renderLibrary();renderTeacher()}
async function saveBook(b){await reqP(db.transaction(STORE,'readwrite').objectStore(STORE).put(b));await loadBooks()}
async function deleteBook(id){await reqP(db.transaction(STORE,'readwrite').objectStore(STORE).delete(id));await loadBooks()}
function url(x){return x?URL.createObjectURL(x):''}
function renderLibrary(){let g=$('#bookGrid');g.innerHTML=''; let all=[...books]; if(!all.length) all=sampleBooks();
 all.forEach((b,i)=>{let el=document.createElement('button');el.className='book';if(b.sample)el.innerHTML=`<div class="fakecover">${b.emoji}<br>${b.title}</div><div class="booktitle">${b.title}</div>`;else el.innerHTML=`${b.cover?`<img src="${url(b.cover)}">`:`<div class="fakecover">📚<br>${b.title}</div>`}<div class="booktitle">${b.title}</div>`;el.onclick=()=>openBook(b);g.appendChild(el)})}
function sampleBooks(){return[
 {sample:true,title:'The Rainbow Adventure',emoji:'🌈🐶',pages:[['🌈','Welcome to the Rainbow Room!'],['🐶','A little puppy found a rainbow.'],['⭐','And every color led to a new adventure!']]},
 {sample:true,title:'Bear Says Hello',emoji:'🐻👋',pages:[['🐻','Bear woke up and stretched.'],['👋','Hello, friends! said Bear.'],['🍯','Then Bear found a very tasty snack.']]},
 {sample:true,title:'The Busy Little Bee',emoji:'🐝🌼',pages:[['🐝','Buzz, buzz! A little bee flew by.'],['🌼','She visited a bright flower.'],['🏡','Then she flew home.']]},
 {sample:true,title:'Dinosaur Dance',emoji:'🦕🎵',pages:[['🦕','The dinosaurs were ready to dance!'],['🕺','Stomp, stomp, wiggle, wiggle!'],['🌙','Then the sleepy dinosaurs went to bed.']]},
 {sample:true,title:'A Very Silly Cat',emoji:'🐱🎩',pages:[['🐱','This cat was VERY silly.'],['🎩','He wore a hat on his tail.'],['😹','Everyone laughed and laughed.']]},
 {sample:true,title:'Goodnight, Classroom',emoji:'🌙🏫',pages:[['🌙','The classroom grew quiet.'],['🧸','Goodnight toys. Goodnight books.'],['⭐','See you tomorrow!']]}
]}
function openBook(b){currentBook=b;currentPage=0;$('#mainHeader').style.display='none';$('#library').style.display='none';$('#reader').style.display='block';$('#readerTitle').textContent=b.title;showPage()}
function showPage(){let p=currentBook.sample?currentBook.pages[currentPage]:currentBook.pages[currentPage];let w=$('#pageWrap');w.innerHTML='';
 if(currentBook.sample){w.innerHTML=`<div class="samplepage"><div class="big">${p[0]}</div><h2>${currentBook.title}</h2><p>${p[1]}</p></div>`; speak(p[1])}
 else {if(p.photo){let im=document.createElement('img');im.src=url(p.photo);w.appendChild(im)}else w.innerHTML='<div class="samplepage"><div class="big">📖</div><p>Page photo</p></div>'; playAudio(p.audio)}
 $('#prevBtn').style.visibility=currentPage? 'visible':'hidden';$('#nextBtn').style.visibility=currentPage<currentBook.pages.length-1?'visible':'hidden'}
function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.85;speechSynthesis.speak(u)}
function playAudio(blob){if(!blob)return; let a=new Audio(url(blob));a.play().catch(()=>{})}
$('#replayBtn').onclick=()=>{let p=currentBook.pages[currentPage];currentBook.sample?speak(p[1]):playAudio(p.audio)}
$('#prevBtn').onclick=()=>{if(currentPage>0){currentPage--;showPage()}};$('#nextBtn').onclick=()=>{if(currentPage<currentBook.pages.length-1){currentPage++;showPage()}}
$('#homeBtn').onclick=()=>{speechSynthesis.cancel();$('#reader').style.display='none';$('#mainHeader').style.display='flex';$('#library').style.display='block'}

function startHold(){longTimer=setTimeout(()=>{$('#pinModal').style.display='grid';$('#pinInput').focus()},3500)} function endHold(){clearTimeout(longTimer)}
$('#secretLogo').addEventListener('touchstart',startHold,{passive:true});$('#secretLogo').addEventListener('touchend',endHold);$('#secretLogo').addEventListener('mousedown',startHold);$('#secretLogo').addEventListener('mouseup',endHold);$('#secretLogo').addEventListener('mouseleave',endHold);
$('#pinCancel').onclick=()=>$('#pinModal').style.display='none';$('#pinGo').onclick=()=>{if($('#pinInput').value==='2468'){ $('#pinModal').style.display='none';$('#pinInput').value='';showTeacher()}else alert('Wrong PIN')}
function showTeacher(){$('#mainHeader').style.display='none';$('#library').style.display='none';$('#reader').style.display='none';$('#teacher').style.display='block';renderTeacher()}
$('#exitTeacher').onclick=()=>{$('#teacher').style.display='none';$('#editor').style.display='none';$('#teacherHome').style.display='block';$('#mainHeader').style.display='flex';$('#library').style.display='block';renderLibrary()}
function renderTeacher(){if(!$('#teacherHome'))return;let h=$('#teacherHome');h.innerHTML='<h2>My Books</h2>';if(!books.length)h.innerHTML+='<p>No real books yet. Tap <b>+ Add Book</b> to make your first one.</p>';books.forEach(b=>{let d=document.createElement('div');d.className='teacherBook';d.innerHTML=`<div><b>${b.title}</b><div class="small">${b.pages.length} page${b.pages.length===1?'':'s'}</div></div><div class="actions"><button class="secondary">Edit</button><button class="danger">Delete</button></div>`;d.querySelector('.secondary').onclick=()=>editBook(b);d.querySelector('.danger').onclick=async()=>{if(confirm('Delete this book?'))await deleteBook(b.id)};h.appendChild(d)})}
$('#newBook').onclick=()=>editBook({id:'b'+Date.now(),title:'',cover:null,pages:[]});
function editBook(b){editing={...b,pages:(b.pages||[]).map(p=>({...p}))};$('#teacherHome').style.display='none';$('#editor').style.display='block';renderEditor()}
function renderEditor(){let e=$('#editor');e.innerHTML=`<div class="teacherHead"><h2>${editing.title?'Edit Book':'New Book'}</h2><button class="secondary" id="cancelEdit">Back</button></div>
<div class="formcard"><div class="field"><label><b>Book title</b></label><input type="text" id="titleInput" value="${esc(editing.title)}" placeholder="Book title"></div>
<div class="field"><label><b>Cover photo</b></label><input type="file" id="coverInput" accept="image/*" capture="environment">${editing.cover?`<img class="preview" src="${url(editing.cover)}">`:''}</div></div>
<h2>Pages</h2><div id="pages"></div><div class="actions"><button class="secondary" id="addPage">＋ Add Page</button><button class="primary" id="saveAll">💾 Save Book</button></div>`;
 $('#cancelEdit').onclick=()=>{$('#editor').style.display='none';$('#teacherHome').style.display='block';renderTeacher()};
 $('#titleInput').oninput=x=>editing.title=x.target.value;$('#coverInput').onchange=x=>{editing.cover=x.target.files[0]||editing.cover;renderEditor()};
 $('#addPage').onclick=()=>{editing.pages.push({photo:null,audio:null});renderEditor()};$('#saveAll').onclick=async()=>{if(!editing.title.trim())return alert('Give the book a title first.');if(!editing.pages.length)return alert('Add at least one page.');await saveBook(editing);$('#editor').style.display='none';$('#teacherHome').style.display='block';renderTeacher()};renderPages()}
function renderPages(){let box=$('#pages');box.innerHTML='';editing.pages.forEach((p,i)=>{let d=document.createElement('div');d.className='pagecard';d.innerHTML=`<h3>Page ${i+1}</h3><div class="field"><label><b>Page photo</b></label><input class="photo" type="file" accept="image/*" capture="environment">${p.photo?`<img class="preview" src="${url(p.photo)}">`:''}</div><div class="actions"><button class="primary record">🎙️ Record</button>${p.audio?'<span>✅ Recording saved</span><button class="secondary listen">▶️ Listen</button>':''}<button class="danger remove">Remove page</button></div><p class="small">Tap Record, read this page, then tap Stop.</p>`;
 let photo=d.querySelector('.photo');photo.onchange=x=>{p.photo=x.target.files[0]||p.photo;renderEditor()};d.querySelector('.remove').onclick=()=>{editing.pages.splice(i,1);renderEditor()};
 let rb=d.querySelector('.record');rb.onclick=async()=>{if(rec&&rec.state==='recording'){rec.stop();rb.textContent='🎙️ Record';return}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=x=>chunks.push(x.data);rec.onstop=()=>{p.audio=new Blob(chunks,{type:rec.mimeType||'audio/webm'});stream.getTracks().forEach(t=>t.stop());rec=null;renderEditor()};rec.start();rb.textContent='⏹ Stop'}catch(err){alert('Microphone permission is needed to record your reading.')}};let li=d.querySelector('.listen');if(li)li.onclick=()=>playAudio(p.audio);box.appendChild(d)})}
function esc(s){return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
openDB().catch(e=>{console.error(e);alert('The library storage could not open on this browser.')});
</script>
</body></html>
