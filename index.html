<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='apple-mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-status-bar-style' content='default'><title>Rainbow Room Library</title><link rel='manifest' href='manifest.json'><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#27243a;background:#fffaf2}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#fffaf2,#f7f4ff)}header{padding:22px 24px 10px;text-align:center}h1{margin:0;font-size:clamp(28px,5vw,52px)}.sub{margin:8px 0 0;color:#6c687a;font-size:18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding:22px;max-width:1100px;margin:auto}.book{border:0;background:white;border-radius:24px;padding:0;overflow:hidden;box-shadow:0 8px 24px #0002;min-height:250px;cursor:pointer}.cover{height:220px;display:flex;align-items:center;justify-content:center;padding:20px;font-weight:800;font-size:30px;text-align:center;background:linear-gradient(135deg,#ffe9a8,#ffd4e8 45%,#d7eaff)}.book span{display:block;padding:14px;font-size:20px;font-weight:700}.viewer{display:none;min-height:100vh;padding:16px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}.iconbtn,.navbtn{border:0;border-radius:20px;background:white;box-shadow:0 4px 14px #0002;font-size:28px;font-weight:800;min-width:74px;min-height:64px}.page{max-width:1000px;height:calc(100vh - 190px);min-height:420px;margin:14px auto;background:white;border-radius:26px;box-shadow:0 8px 28px #0002;display:flex;align-items:center;justify-content:center;padding:38px;text-align:center;font-size:clamp(34px,6vw,72px);font-weight:800}.controls{display:flex;justify-content:center;gap:42px}.navbtn{min-width:150px;font-size:42px}.counter{font-size:22px;font-weight:700;color:#6c687a}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr);gap:16px;padding:16px}.cover{height:190px}.page{height:calc(100vh - 175px)}}
</style></head><body>
<section id='library'><header><h1>🌈 Rainbow Room Library 🌈</h1><p class='sub'>Touch a book to listen.</p></header><main class='grid' id='grid'></main></section>
<section id='viewer' class='viewer'><div class='topbar'><button class='iconbtn' id='home' aria-label='Home'>🌈</button><div class='counter' id='counter'></div><button class='iconbtn' id='sound' aria-label='Play sound'>🔊</button></div><div class='page' id='page'></div><div class='controls'><button class='navbtn' id='prev'>⬅️</button><button class='navbtn' id='next'>➡️</button></div></section>
<script>
const books=[
 {title:'The Rainbow Picnic',cover:'🌈\nThe Rainbow Picnic',pages:['Welcome to our sample book!','The friends packed a picnic.','They found every color of the rainbow.','Then they shared lunch together.','The end! 🌈']},
 {title:'Bear Finds a Friend',cover:'🐻\nBear Finds a Friend',pages:['Bear went for a walk.','He heard a tiny sound.','A little bird was nearby.','Bear and Bird became friends.','The end! 🐻']},
 {title:'A Very Busy Bunny',cover:'🐰\nA Very Busy Bunny',pages:['Bunny had a busy morning.','First, Bunny watered the flowers.','Next, Bunny gathered carrots.','Then Bunny took a nap.','The end! 🥕']},
 {title:'Our Silly School Day',cover:'🏫\nOur Silly School Day',pages:['Something silly happened at school.','The blocks were wearing hats!','The paintbrushes danced in a cup.','Everyone laughed together.','The end! 😄']},
 {title:'Little Blue Bird',cover:'🐦\nLittle Blue Bird',pages:['Little Blue Bird looked at the sky.','She flew over the trees.','She sang a happy song.','Then she flew home.','The end! 🐦']},
 {title:'Goodnight, Classroom',cover:'🌙\nGoodnight, Classroom',pages:['The classroom grew quiet.','Goodnight, books.','Goodnight, blocks.','Goodnight, Rainbow Room.','The end. 🌙']}
];
let b=0,p=0; const grid=document.getElementById('grid'),lib=document.getElementById('library'),view=document.getElementById('viewer'),page=document.getElementById('page'),counter=document.getElementById('counter');
books.forEach((x,i)=>{let btn=document.createElement('button');btn.className='book';btn.innerHTML=`<div class="cover">${x.cover.replace('\n','<br>')}</div><span>${x.title}</span>`;btn.onclick=()=>openBook(i);grid.appendChild(btn)});
function openBook(i){b=i;p=0;lib.style.display='none';view.style.display='block';render()}
function render(){page.textContent=books[b].pages[p];counter.textContent=`${books[b].title} • ${p+1} / ${books[b].pages.length}`;document.getElementById('prev').disabled=p===0;document.getElementById('next').textContent=p===books[b].pages.length-1?'🌈':'➡️'}
document.getElementById('home').onclick=()=>{view.style.display='none';lib.style.display='block'};
document.getElementById('prev').onclick=()=>{if(p>0){p--;render()}};
document.getElementById('next').onclick=()=>{if(p<books[b].pages.length-1){p++;render()}else{view.style.display='none';lib.style.display='block'}};
document.getElementById('sound').onclick=()=>{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(books[b].pages[p]))};
</script></body></html>
